name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch cancels the older, now-pointless run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # the same Postgres as docker-compose.yml, on the same port, so the default database URL works
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pairspace
          POSTGRES_PASSWORD: pairspace
          POSTGRES_DB: pairspace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pairspace"
          --health-interval 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # the same Postgres as docker-compose.yml, on the same port, so the default database URL works
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pairspace
          POSTGRES_PASSWORD: pairspace
          POSTGRES_DB: pairspace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pairspace"
          --health-interval 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # traces of failed tests; open with: npx playwright show-trace <file>
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
