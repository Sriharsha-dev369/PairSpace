<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PairSpace WebSocket test</title>
    <style>
      body { font-family: monospace; max-width: 600px; margin: 2rem auto; }
      #status { font-weight: bold; }
      #log { border: 1px solid #ccc; height: 250px; overflow-y: auto; padding: 0.5rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div>Status: <span id="status">connecting...</span></div>
    <input id="msg" placeholder="type a message" />
    <button id="send">Send</button>
    <div id="log"></div>

    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const input = document.getElementById("msg");

      function addLine(text) {
        const line = document.createElement("div");
        line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // the room lives in the page URL (#room-name), so copying the URL is the invite link
      if (!location.hash) location.hash = crypto.randomUUID().slice(0, 8);
      const room = location.hash.slice(1);
      document.title = `PairSpace test (${room})`;

      const ws = new WebSocket(`ws://localhost:8080/${room}`);

      ws.onopen = () => { statusEl.textContent = `open, room "${room}"`; addLine(`joined room ${room}`); };
      ws.onclose = (e) => { statusEl.textContent = "closed"; addLine(`closed (code ${e.code})`); };
      ws.onerror = () => addLine("error");
      ws.onmessage = (e) => addLine(`them: ${e.data}`);

      function send() {
        if (ws.readyState !== WebSocket.OPEN) return addLine("cannot send, connection is not open");
        ws.send(input.value);
        addLine(`me: ${input.value}`);
        input.value = "";
      }
      document.getElementById("send").onclick = send;
      input.onkeydown = (e) => { if (e.key === "Enter") send(); };
    </script>
  </body>
</html>
