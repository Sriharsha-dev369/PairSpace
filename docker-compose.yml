# Local Postgres for development and tests. Start: npm run db:up, stop: npm run db:down
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pairspace
      POSTGRES_PASSWORD: pairspace
      POSTGRES_DB: pairspace
    ports:
      - "5433:5432" # 5433 on this machine, so it never clashes with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairspace"]
      interval: 1s
      retries: 30

volumes:
  pgdata:
